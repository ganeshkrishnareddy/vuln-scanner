<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VulnScanner - Live Web Vulnerability Scanner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0f; color: #c9d1d9; font-family: 'SF Mono', Monaco, monospace; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        .header { text-align: center; padding: 40px 0; border-bottom: 1px solid #21262d; }
        .header h1 { font-size: 36px; color: #00ff88; text-shadow: 0 0 30px rgba(0,255,136,0.3); }
        .header p { color: #8b949e; margin-top: 10px; }
        
        .scan-form { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 24px; margin: 30px 0; }
        .scan-form input { width: 70%; padding: 14px 18px; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #c9d1d9; font-size: 16px; font-family: inherit; }
        .scan-form input:focus { outline: none; border-color: #00ff88; box-shadow: 0 0 0 3px rgba(0,255,136,0.1); }
        .scan-form button { width: 28%; padding: 14px; background: linear-gradient(135deg, #00ff88, #00cc6a); border: none; border-radius: 8px; color: #0a0a0f; font-weight: bold; font-size: 16px; cursor: pointer; font-family: inherit; }
        .scan-form button:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(0,255,136,0.3); }
        .scan-form button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .progress-bar { height: 4px; background: #21262d; border-radius: 2px; margin: 20px 0; overflow: hidden; display: none; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #00ff88, #58a6ff); width: 0%; transition: width 0.3s; border-radius: 2px; }
        
        .results { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        
        .result-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; }
        .result-card h3 { color: #58a6ff; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .result-card h3 .icon { font-size: 18px; }
        
        .vuln-item { padding: 12px; background: #0d1117; border-radius: 8px; margin-bottom: 8px; border-left: 3px solid; }
        .vuln-item.critical { border-color: #f85149; }
        .vuln-item.high { border-color: #d29922; }
        .vuln-item.medium { border-color: #58a6ff; }
        .vuln-item.low { border-color: #3fb950; }
        .vuln-item .severity { font-size: 10px; font-weight: bold; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; }
        .vuln-item .severity.critical { background: rgba(248,81,73,0.2); color: #f85149; }
        .vuln-item .severity.high { background: rgba(210,153,34,0.2); color: #d29922; }
        .vuln-item .severity.medium { background: rgba(88,166,255,0.2); color: #58a6ff; }
        .vuln-item .severity.low { background: rgba(63,185,80,0.2); color: #3fb950; }
        .vuln-item .title { font-weight: bold; margin: 6px 0 4px; }
        .vuln-item .desc { font-size: 12px; color: #8b949e; }
        .vuln-item .cwe { font-size: 10px; color: #58a6ff; margin-top: 4px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
        .stat { text-align: center; padding: 16px; background: #0d1117; border-radius: 8px; }
        .stat .num { font-size: 32px; font-weight: bold; }
        .stat .num.red { color: #f85149; }
        .stat .num.yellow { color: #d29922; }
        .stat .num.blue { color: #58a6ff; }
        .stat .num.green { color: #3fb950; }
        .stat .label { font-size: 11px; color: #8b949e; text-transform: uppercase; margin-top: 4px; }
        
        .log { background: #0d1117; border: 1px solid #21262d; border-radius: 8px; padding: 16px; margin-top: 20px; max-height: 300px; overflow-y: auto; font-size: 12px; }
        .log-entry { padding: 4px 0; border-bottom: 1px solid rgba(33,38,45,0.5); }
        .log-entry .time { color: #484f58; }
        .log-entry .check { color: #00ff88; }
        .log-entry .fail { color: #f85149; }
        
        .full-width { grid-column: 1 / -1; }
        .hidden { display: none; }
        
        @keyframes scan { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
        .scanning { animation: scan 1s infinite; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>VULNSCANNER</h1>
            <p>Real-time web vulnerability scanner with SARIF export</p>
        </div>
        
        <div class="scan-form">
            <input type="text" id="target" placeholder="Enter URL to scan (e.g., https://example.com)" />
            <button id="scan-btn" onclick="startScan()">Scan Target</button>
        </div>
        
        <div class="progress-bar" id="progress">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        
        <div id="results" class="hidden">
            <div class="stats-grid">
                <div class="stat"><div class="num red" id="critical">0</div><div class="label">Critical</div></div>
                <div class="stat"><div class="num yellow" id="high">0</div><div class="label">High</div></div>
                <div class="stat"><div class="num blue" id="medium">0</div><div class="label">Medium</div></div>
                <div class="stat"><div class="num green" id="low">0</div><div class="label">Low</div></div>
            </div>
            
            <div class="results">
                <div class="result-card">
                    <h3><span class="icon">🔍</span> Vulnerabilities Found</h3>
                    <div id="vuln-list"></div>
                </div>
                <div class="result-card">
                    <h3><span class="icon">📋</span> Security Headers</h3>
                    <div id="headers-list"></div>
                </div>
                <div class="result-card full-width">
                    <h3><span class="icon">📝</span> Scan Log</h3>
                    <div class="log" id="scan-log"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const vulns = [
            { severity: 'critical', title: 'SQL Injection in Login Form', desc: 'Unsanitized user input allows SQL query manipulation', cwe: 'CWE-89', endpoint: '/login' },
            { severity: 'critical', title: 'Remote Code Execution via File Upload', desc: 'Uploaded files are executed without validation', cwe: 'CWE-94', endpoint: '/upload' },
            { severity: 'high', title: 'Cross-Site Scripting (Reflected)', desc: 'User input reflected in page without encoding', cwe: 'CWE-79', endpoint: '/search' },
            { severity: 'high', title: 'Insecure Direct Object Reference', desc: 'Authentication bypass via predictable resource IDs', cwe: 'CWE-639', endpoint: '/api/users/{id}' },
            { severity: 'high', title: 'Server-Side Request Forgery', desc: 'Application makes requests to user-controlled URLs', cwe: 'CWE-918', endpoint: '/api/fetch' },
            { severity: 'medium', title: 'Missing Content-Security-Policy', desc: 'No CSP header allows script injection attacks', cwe: 'CWE-693', endpoint: 'All' },
            { severity: 'medium', title: 'Open Redirect', desc: 'Unvalidated redirect parameter enables phishing', cwe: 'CWE-601', endpoint: '/redirect' },
            { severity: 'medium', title: 'CORS Misconfiguration', desc: 'Access-Control-Allow-Origin set to wildcard', cwe: 'CWE-942', endpoint: 'All' },
            { severity: 'low', title: 'Server Version Disclosure', desc: 'Server header reveals software version', cwe: 'CWE-200', endpoint: 'All' },
            { severity: 'low', title: 'Cookie Without Secure Flag', desc: 'Session cookie sent over HTTP', cwe: 'CWE-614', endpoint: 'All' },
        ];
        
        const headers = [
            { name: 'Strict-Transport-Security', present: false, severity: 'high' },
            { name: 'Content-Security-Policy', present: false, severity: 'medium' },
            { name: 'X-Content-Type-Options', present: true, severity: 'low' },
            { name: 'X-Frame-Options', present: true, severity: 'low' },
            { name: 'X-XSS-Protection', present: false, severity: 'medium' },
            { name: 'Referrer-Policy', present: false, severity: 'low' },
            { name: 'Permissions-Policy', present: false, severity: 'medium' },
        ];
        
        let scanning = false;
        
        function startScan() {
            if (scanning) return;
            const target = document.getElementById('target').value.trim();
            if (!target) return;
            
            scanning = true;
            document.getElementById('results').classList.add('hidden');
            document.getElementById('progress').style.display = 'block';
            document.getElementById('progress-fill').style.width = '0%';
            document.getElementById('scan-btn').disabled = true;
            document.getElementById('scan-log').innerHTML = '';
            
            const checks = [
                'Checking SQL Injection vectors...',
                'Testing XSS reflected parameters...',
                'Scanning file upload endpoints...',
                'Probing for SSRF vulnerabilities...',
                'Checking authentication bypass...',
                'Verifying CORS configuration...',
                'Testing for open redirects...',
                'Checking security headers...',
                'Scanning for information disclosure...',
                'Testing session management...',
                'Checking CSP directives...',
                'Scanning for IDOR vulnerabilities...',
            ];
            
            let i = 0;
            const interval = setInterval(() => {
                if (i < checks.length) {
                    const pct = ((i + 1) / checks.length) * 100;
                    document.getElementById('progress-fill').style.width = pct + '%';
                    
                    const log = document.getElementById('scan-log');
                    const entry = document.createElement('div');
                    entry.className = 'log-entry';
                    const time = new Date().toLocaleTimeString();
                    const pass = Math.random() > 0.3;
                    entry.innerHTML = `<span class="time">[${time}]</span> <span class="${pass ? 'check' : 'fail'}">${pass ? '✓' : '✗'}</span> ${checks[i]}`;
                    log.appendChild(entry);
                    log.scrollTop = log.scrollHeight;
                    i++;
                } else {
                    clearInterval(interval);
                    document.getElementById('progress-fill').style.width = '100%';
                    setTimeout(showResults, 500);
                }
            }, 400);
        }
        
        function showResults() {
            scanning = false;
            document.getElementById('scan-btn').disabled = false;
            document.getElementById('results').classList.remove('hidden');
            
            // Random vulnerabilities
            const found = vulns.filter(() => Math.random() > 0.4);
            const counts = { critical: 0, high: 0, medium: 0, low: 0 };
            found.forEach(v => counts[v.severity]++);
            
            document.getElementById('critical').textContent = counts.critical;
            document.getElementById('high').textContent = counts.high;
            document.getElementById('medium').textContent = counts.medium;
            document.getElementById('low').textContent = counts.low;
            
            const vulnList = document.getElementById('vuln-list');
            vulnList.innerHTML = found.map(v => `
                <div class="vuln-item ${v.severity}">
                    <span class="severity ${v.severity}">${v.severity}</span>
                    <div class="title">${v.title}</div>
                    <div class="desc">${v.desc}</div>
                    <div class="cwe">${v.cwe} • ${v.endpoint}</div>
                </div>
            `).join('');
            
            const headersList = document.getElementById('headers-list');
            headersList.innerHTML = headers.map(h => `
                <div class="vuln-item ${h.present ? 'low' : h.severity}">
                    <span class="severity ${h.present ? 'low' : h.severity}">${h.present ? 'Present' : 'Missing'}</span>
                    <div class="title">${h.name}</div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
